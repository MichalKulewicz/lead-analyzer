<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wymagają uwagi - Lead Analyzer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            margin: 5px 0 0;
            color: #9ca3af;
        }

        button {
            border: none;
            padding: 11px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .primary {
            background: #111827;
            color: white;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        }

        .card h3 {
            margin: 0 0 10px;
            font-size: 14px;
            color: #6b7280;
        }

        .number {
            font-size: 34px;
            font-weight: bold;
        }

        .danger-number {
            color: #dc2626;
        }

        .leads {
            display: grid;
            gap: 16px;
        }

        .lead-card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .lead-card:hover {
            transform: translateY(-2px);
        }

        .lead-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: flex-start;
        }

        .city {
            font-size: 20px;
            font-weight: bold;
        }

        .budget {
            margin-top: 6px;
            color: #6b7280;
        }

        .score {
            font-size: 24px;
            font-weight: bold;
            color: #dc2626;
        }

        .badges {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-hot {
            background: #fee2e2;
            color: #b91c1c;
        }

        .badge-new {
            background: #e5e7eb;
            color: #374151;
        }

        .message {
            margin-top: 14px;
            background: #f9fafb;
            padding: 14px;
            border-radius: 8px;
            line-height: 1.5;
        }

        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 14px;
            color: #6b7280;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        @media (max-width: 800px) {
            .summary {
                grid-template-columns: 1fr;
            }

            .lead-top {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>

    <div>
        <h1>🚨 Wymagają uwagi</h1>
        <p>Najważniejsze leady, które nadal czekają na obsługę</p>
    </div>

    <button class="secondary" onclick="window.location.href='/'">
        ← Dashboard
    </button>

</header>

<div class="container">

    <div id="errorBox" class="error"></div>

    <div class="summary">

        <div class="card">
            <h3>PILNE LEADY</h3>
            <div id="attentionCount" class="number danger-number">-</div>
        </div>

        <div class="card">
            <h3>STATUS</h3>
            <div class="number">NOWY</div>
        </div>

    </div>

    <div id="leadsList" class="leads"></div>

    <div id="emptyState" class="empty" style="display:none;">
        ✅ Brak leadów wymagających uwagi.
    </div>

</div>

<script>

const token =
    localStorage.getItem("leadAnalyzerToken");

if (!token) {
    window.location.href = "/";
}


async function pobierzAttention() {

    try {

        const response =
            await fetch(
                "/api/leads/attention",
                {
                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        const data =
            await response.json();


        if (response.status === 401) {

            localStorage.removeItem(
                "leadAnalyzerToken"
            );

            window.location.href = "/";

            return;
        }


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Nie udało się pobrać leadów."
            );
        }


        document.getElementById(
            "attentionCount"
        ).textContent =
            data.count || 0;


        wyswietlLeady(
            data.leads || []
        );


    } catch (error) {

        const box =
            document.getElementById(
                "errorBox"
            );

        box.style.display =
            "block";

        box.textContent =
            `❌ ${error.message}`;
    }
}


function wyswietlLeady(leady) {

    const lista =
        document.getElementById(
            "leadsList"
        );

    const empty =
        document.getElementById(
            "emptyState"
        );


    lista.innerHTML = "";


    if (leady.length === 0) {

        empty.style.display =
            "block";

        return;
    }


    empty.style.display =
        "none";


    leady.forEach(lead => {

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "lead-card";


        const budzet =
            lead.budzet
                ? Number(
                    lead.budzet
                ).toLocaleString("pl-PL")
                : "-";


        card.innerHTML = `
            <div class="lead-top">

                <div>
                    <div class="city">
                        ${lead.miasto || "Brak miasta"}
                    </div>

                    <div class="budget">
                        Budżet:
                        ${budzet}
                        ${lead.waluta || ""}
                    </div>
                </div>

                <div class="score">
                    ${lead.score}/100
                </div>

            </div>

            <div class="badges">

                <span class="badge badge-hot">
                    ${lead.klasyfikacja}
                </span>

                <span class="badge badge-new">
                    ${lead.status_obslugi || "NOWY"}
                </span>

            </div>

            <div class="message">
                ${lead.wiadomosc || ""}
            </div>
        `;


        card.onclick = () => {

            localStorage.setItem(
                "openLeadId",
                lead.id
            );

            window.location.href = "/";
        };


        lista.appendChild(
            card
        );
    });
}


pobierzAttention();

</script>

</body>
</html>
