<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moje konto - Lead Analyzer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            margin: 5px 0 0;
            color: #9ca3af;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .primary {
            width: 100%;
            background: #111827;
            color: white;
            margin-top: 8px;
        }

        .container {
            max-width: 700px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,.07);
        }

        .card h2 {
            margin-top: 0;
        }

        .user-row {
            padding: 12px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .user-row:last-child {
            border-bottom: none;
        }

        .label {
            font-size: 12px;
            color: #6b7280;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .value {
            font-size: 16px;
        }

        .role {
            display: inline-block;
            background: #e5e7eb;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #111827;
        }

        .message {
            display: none;
            padding: 13px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .hint {
            font-size: 12px;
            color: #6b7280;
            margin-top: 6px;
        }
    </style>
</head>

<body>

<header>

    <div>
        <h1>👤 Moje konto</h1>
        <p>Dane konta i bezpieczeństwo</p>
    </div>

    <button
        class="secondary"
        onclick="window.location.href='/'">
        ← Dashboard
    </button>

</header>

<div class="container">

    <div class="card">

        <h2>Informacje o koncie</h2>

        <div class="user-row">
            <div class="label">IMIĘ</div>
            <div id="userName" class="value">...</div>
        </div>

        <div class="user-row">
            <div class="label">EMAIL</div>
            <div id="userEmail" class="value">...</div>
        </div>

        <div class="user-row">
            <div class="label">FIRMA</div>
            <div id="userCompany" class="value">...</div>
        </div>

        <div class="user-row">
            <div class="label">ROLA</div>
            <span id="userRole" class="role">...</span>
        </div>

    </div>


    <div class="card">

        <h2>🔐 Zmień hasło</h2>

        <div
            id="message"
            class="message">
        </div>

        <form id="passwordForm">

            <div class="form-group">

                <label for="currentPassword">
                    Obecne hasło
                </label>

                <input
                    id="currentPassword"
                    type="password"
                    autocomplete="current-password"
                    required>

            </div>


            <div class="form-group">

                <label for="newPassword">
                    Nowe hasło
                </label>

                <input
                    id="newPassword"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    required>

                <div class="hint">
                    Minimum 8 znaków.
                </div>

            </div>


            <div class="form-group">

                <label for="repeatPassword">
                    Powtórz nowe hasło
                </label>

                <input
                    id="repeatPassword"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    required>

            </div>


            <button
                id="saveButton"
                class="primary"
                type="submit">

                Zmień hasło

            </button>

        </form>

    </div>

</div>


<script>

const token =
    localStorage.getItem(
        "leadAnalyzerToken"
    );


if (!token) {
    window.location.href = "/";
}


// ========================================
// DANE UŻYTKOWNIKA
// ========================================

async function pobierzKonto() {

    try {

        const response =
            await fetch(
                "/api/me",
                {
                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        const data =
            await response.json();


        if (response.status === 401) {

            localStorage.removeItem(
                "leadAnalyzerToken"
            );

            window.location.href = "/";

            return;
        }


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Nie udało się pobrać konta."
            );
        }


        const user =
            data.user;


        document.getElementById(
            "userName"
        ).textContent =
            user.imie || "-";


        document.getElementById(
            "userEmail"
        ).textContent =
            user.email || "-";


        document.getElementById(
            "userCompany"
        ).textContent =
            user.firma || "-";


        document.getElementById(
            "userRole"
        ).textContent =
            user.rola || "-";


    } catch (error) {

        pokazKomunikat(
            error.message,
            false
        );
    }
}


// ========================================
// ZMIANA HASŁA
// ========================================

document.getElementById(
    "passwordForm"
).addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const currentPassword =
            document.getElementById(
                "currentPassword"
            ).value;


        const newPassword =
            document.getElementById(
                "newPassword"
            ).value;


        const repeatPassword =
            document.getElementById(
                "repeatPassword"
            ).value;


        if (
            newPassword !== repeatPassword
        ) {

            pokazKomunikat(
                "Nowe hasła nie są identyczne.",
                false
            );

            return;
        }


        if (
            newPassword.length < 8
        ) {

            pokazKomunikat(
                "Nowe hasło musi mieć minimum 8 znaków.",
                false
            );

            return;
        }


        const button =
            document.getElementById(
                "saveButton"
            );


        button.disabled = true;
        button.textContent =
            "Zmieniam...";


        try {

            const response =
                await fetch(
                    "/api/me/password",
                    {
                        method: "PATCH",

                        headers: {

                            "Authorization":
                                `Bearer ${token}`,

                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                currentPassword,
                                newPassword

                            })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Nie udało się zmienić hasła."
                );
            }


            pokazKomunikat(
                "✅ Hasło zostało zmienione.",
                true
            );


            document.getElementById(
                "passwordForm"
            ).reset();


        } catch (error) {

            pokazKomunikat(
                error.message,
                false
            );

        } finally {

            button.disabled = false;

            button.textContent =
                "Zmień hasło";
        }
    }
);


// ========================================
// KOMUNIKAT
// ========================================

function pokazKomunikat(
    tekst,
    sukces
) {

    const box =
        document.getElementById(
            "message"
        );


    box.style.display =
        "block";


    box.className =
        sukces
            ? "message success"
            : "message error";


    box.textContent =
        tekst;
}


// ========================================
// START
// ========================================

pobierzKonto();

</script>

</body>
</html>
